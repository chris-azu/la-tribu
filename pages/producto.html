<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Detalle del plato — La Tribu. Visualiza en 3D y realidad aumentada.">
  <title>Producto — La Tribu</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍔</text></svg>">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/viewer3d.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>

  <!-- MOBILE HEADER -->
  <header class="mobile-header">
    <div class="hamburger" id="hamburger" aria-label="Abrir menú">
      <span></span><span></span><span></span>
    </div>
    <a href="../index.html" class="mobile-logo">La Tribu</a>
    <div class="close-btn" id="closeBtn">&times;</div>
  </header>

  <!-- MOBILE NAV -->
  <nav class="mobile-nav" id="mobileNav">
    <div class="mobile-nav-links">
      <a href="../index.html">Home</a>
      <a href="comida.html">Food</a>
      <a href="nosotros.html">About Us</a>
      <a href="galeria.html">Gallery</a>
      <a href="contacto.html">Contact</a>
    </div>
  </nav>

  <!-- DESKTOP SIDEBAR -->
  <aside class="desktop-sidebar">
    <div class="sidebar-logo">La<br>Tribu</div>
    <nav class="sidebar-nav">
      <a href="../index.html">Home</a>
      <a href="comida.html" class="active">Food</a>
      <a href="nosotros.html">About Us</a>
      <a href="galeria.html">Gallery</a>
      <a href="contacto.html">Contact</a>
    </nav>
  </aside>

  <div class="page-wrapper sidebar-active">

    <!-- PRODUCT DETAIL -->
    <div class="product-detail" id="productDetail">

      <!-- INFO COLUMN -->
      <div class="product-detail-info" id="productInfo">
        <p style="font-size:0.7rem;text-transform:uppercase;letter-spacing:0.2em;color:var(--texto-sec);margin-bottom:12px;" class="fade-in">
          <a href="comida.html" style="color:var(--terracota);">&larr; Menú</a>
        </p>
        <h1 class="product-detail-name fade-in" id="productName">—</h1>
        <p class="product-detail-desc fade-in" id="productDesc"></p>
        <div class="product-detail-price fade-in" id="productPrice"></div>
        <div class="product-detail-buttons fade-in">
          <button class="btn btn-primary btn-full btn-lg btn-press" id="btnView3D" onclick="toggleViewer3D()">
            <i class="fa-solid fa-cube"></i> Ver en 3D
          </button>
          <button class="btn btn-primary btn-full btn-lg btn-press" id="btnAR" onclick="openAR()" style="display:none;">
            <i class="fa-solid fa-vr-cardboard"></i> Ver en mi Espacio
          </button>
          <a href="#" class="btn btn-outline btn-full btn-lg btn-press" id="btnWhatsApp" target="_blank" rel="noopener">
            <i class="fa-brands fa-whatsapp"></i> Pedir por WhatsApp
          </a>
        </div>
      </div>

      <!-- IMAGE / VIEWER COLUMN -->
      <div class="product-detail-image-wrapper" id="productImageWrapper">
        <img class="product-detail-image" id="productImage" src="" alt="">

        <!-- 3D Viewer overlay -->
        <div class="viewer-3d-container" id="productViewer" style="display:none;position:absolute;inset:0;width:100%;height:100%;max-width:none;border:none;">
          <model-viewer
            id="productModelViewer"
            alt="Modelo 3D del plato"
            camera-controls
            auto-rotate
            auto-rotate-delay="2000"
            rotation-per-second="30deg"
            shadow-intensity="0.8"
            shadow-softness="0.5"
            environment-image="neutral"
            touch-action="pan-y"
            loading="lazy"
            ar
            ar-modes="webxr scene-viewer quick-look"
            style="width:100%;height:100%;background:var(--crema);"
          ></model-viewer>
          <div class="viewer-loading hidden" id="productViewerLoading">
            <div class="viewer-spinner"></div>
          </div>
        </div>
      </div>

    </div>

    <!-- AR CONTROLS -->
    <div class="ar-controls" id="arControls" style="display:none;">
      <button class="ar-control-btn" onclick="resetViewer()" title="Restablecer vista">
        <i class="fa-solid fa-rotate-right"></i>
      </button>
      <button class="ar-control-btn" onclick="zoomIn()" title="Acercar">
        <i class="fa-solid fa-magnifying-glass-plus"></i>
      </button>
      <button class="ar-control-btn" onclick="zoomOut()" title="Alejar">
        <i class="fa-solid fa-magnifying-glass-minus"></i>
      </button>
      <button class="ar-control-btn" onclick="toggleFullscreen()" title="Pantalla completa">
        <i class="fa-solid fa-expand"></i>
      </button>
    </div>

    <!-- AR STATUS -->
    <div class="ar-status" id="arStatus" style="display:none;"></div>

    <!-- FOOTER -->
    <footer class="site-footer">
      <div class="footer-logo">La Tribu</div>
      <nav class="footer-nav">
        <a href="../index.html">Home</a>
        <a href="comida.html">Food</a>
        <a href="nosotros.html">About Us</a>
        <a href="galeria.html">Gallery</a>
        <a href="contacto.html">Contact</a>
      </nav>
      <p class="footer-copy">&copy; 2024 La Tribu. Exclusive Culinary Experience.</p>
    </footer>

  </div>

  <!-- MOBILE BOTTOM BAR -->
  <div class="mobile-bottom-bar">
    <div class="mobile-bottom-bar-left">
      <button aria-label="Carrito">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
      </button>
    </div>
    <div class="mobile-bottom-bar-right">
      <a href="https://wa.me/5491123456789" target="_blank" rel="noopener" aria-label="WhatsApp">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
      </a>
    </div>
  </div>

  <!-- FULLSCREEN VIEWER -->
  <div class="viewer-fullscreen" id="fullscreenViewer">
    <div class="viewer-fullscreen-header">
      <span class="viewer-fullscreen-title" id="fullscreenTitle"></span>
      <span class="viewer-fullscreen-close" onclick="closeFullscreen()">&times;</span>
    </div>
    <model-viewer
      id="fullscreenModelViewer"
      alt="Modelo 3D fullscreen"
      camera-controls
      auto-rotate
      auto-rotate-delay="2000"
      rotation-per-second="25deg"
      shadow-intensity="0.8"
      environment-image="neutral"
      touch-action="pan-y"
      ar
      ar-modes="webxr scene-viewer quick-look"
      style="width:100%;height:100%;background:var(--crema);"
    ></model-viewer>
  </div>

  <script src="../data/config.js"></script>
  <script src="../data/products.js"></script>
  <script src="../js/navigation.js"></script>
  <script src="../js/whatsapp.js"></script>
  <script src="../js/animations.js"></script>
  <script src="../js/viewer3d.js"></script>
  <script src="../js/arService.js"></script>
  <script>
    let currentProduct = null;

    document.addEventListener('DOMContentLoaded', function() {
      const params = new URLSearchParams(window.location.search);
      const id = parseInt(params.get('id'));
      currentProduct = PRODUCTS.find(p => p.id === id);

      if (!currentProduct) {
        window.location.href = 'comida.html';
        return;
      }

      document.title = currentProduct.name + ' — La Tribu';
      document.getElementById('productName').textContent = currentProduct.name;
      document.getElementById('productDesc').textContent = currentProduct.description;
      document.getElementById('productPrice').textContent = '$' + currentProduct.price.toFixed(2) + ' USD';
      document.getElementById('productImage').src = '../' + currentProduct.image;
      document.getElementById('productImage').alt = currentProduct.name;
      document.getElementById('fullscreenTitle').textContent = currentProduct.name;

      // WhatsApp link
      const waBtn = document.getElementById('btnWhatsApp');
      waBtn.href = generateWhatsAppLink(currentProduct.name, currentProduct.price);

      // 3D viewer availability
      if (currentProduct.model_glb) {
        document.getElementById('btnView3D').style.display = '';
      } else {
        document.getElementById('btnView3D').style.display = 'none';
      }

      // AR capability
      const arCap = ARService.detect();
      if (arCap.supported && currentProduct.model_glb) {
        document.getElementById('btnAR').style.display = '';
        if (currentProduct.model_usdz && arCap.quickLook) {
          document.getElementById('btnAR').innerHTML = '<i class="fa-solid fa-vr-cardboard"></i> Ver en mi Espacio';
        } else if (currentProduct.model_glb && arCap.sceneViewer) {
          document.getElementById('btnAR').innerHTML = '<i class="fa-solid fa-vr-cardboard"></i> Ver en mi Espacio';
        }
      }
    });

    function toggleViewer3D() {
      const img = document.getElementById('productImage');
      const viewer = document.getElementById('productViewer');
      const controls = document.getElementById('arControls');
      const modelViewer = document.getElementById('productModelViewer');
      const loading = document.getElementById('productViewerLoading');

      if (viewer.style.display === 'none') {
        img.style.display = 'none';
        viewer.style.display = '';
        controls.style.display = '';
        loading.classList.remove('hidden');

        if (currentProduct.model_glb) {
          modelViewer.src = '../' + currentProduct.model_glb;
          if (currentProduct.model_usdz) {
            modelViewer.setAttribute('ios-src', '../' + currentProduct.model_usdz);
          }
        }

        modelViewer.addEventListener('load', function onLoad() {
          loading.classList.add('hidden');
          modelViewer.removeEventListener('load', onLoad);
        });
      } else {
        img.style.display = '';
        viewer.style.display = 'none';
        controls.style.display = 'none';
      }
    }

    function openAR() {
      ARService.openAR({
        model_glb: currentProduct.model_glb ? window.location.origin + '/uploads/models/' + currentProduct.model_glb.replace('assets/models/', '') : null,
        model_usdz: currentProduct.model_usdz ? window.location.origin + '/uploads/models/' + currentProduct.model_usdz.replace('assets/models/', '') : null
      });
    }

    function resetViewer() {
      const mv = document.getElementById('productModelViewer');
      if (mv) {
        mv.cameraOrbit = '0deg 75deg 105%';
        mv.fieldOfView = '30deg';
      }
    }

    function zoomIn() {
      const mv = document.getElementById('productModelViewer');
      if (mv) mv.fieldOfView = Math.max(10, mv.getFieldOfView() - 5) + 'deg';
    }

    function zoomOut() {
      const mv = document.getElementById('productModelViewer');
      if (mv) mv.fieldOfView = Math.min(90, mv.getFieldOfView() + 5) + 'deg';
    }

    function toggleFullscreen() {
      const fs = document.getElementById('fullscreenViewer');
      const mv = document.getElementById('fullscreenModelViewer');
      fs.classList.add('active');
      if (currentProduct.model_glb) {
        mv.src = '../' + currentProduct.model_glb;
        if (currentProduct.model_usdz) {
          mv.setAttribute('ios-src', '../' + currentProduct.model_usdz);
        }
      }
    }

    function closeFullscreen() {
      document.getElementById('fullscreenViewer').classList.remove('active');
    }
  </script>
</body>
</html>
