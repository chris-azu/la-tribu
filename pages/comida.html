  <!-- DESKTOP SIDEBAR -->

    <nav class="sidebar-nav">

  <div class="page-wrapper sidebar-active">

    <!-- SECTION HEADER -->
    <section class="section" style="padding-bottom: 0;">

    <!-- FILTERS -->
    <div class="food-filters" id="foodFilters">
      <button class="food-filter-btn active" data-filter="all">Todos</button>
      <button class="food-filter-btn" data-filter="comida">Comida</button>
      <button class="food-filter-btn" data-filter="snacks">Snacks</button>
      <button class="food-filter-btn" data-filter="bebidas">Bebidas</button>
      <button class="food-filter-btn" data-filter="postres">Postres</button>
    </div>

    <!-- PRODUCTS GRID -->
    <section class="section" style="padding-top: 10px;">
      <div class="container">
        <div class="products-grid stagger" id="foodProducts">
          <!-- Loaded dynamically -->
        </div>

    </section>

    <!-- FOOTER -->
    <footer class="site-footer">
      <div class="footer-logo">La Tribu</div>
      <nav class="footer-nav">
        <a href="../index.html">Home</a>
        <a href="comida.html">Food</a>
        <a href="nosotros.html">About Us</a>
        <a href="galeria.html">Gallery</a>
        <a href="contacto.html">Contact</a>

  </div>

  <!-- MOBILE BOTTOM BAR -->
  <div class="mobile-bottom-bar">

        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
      </button>
    </div>
    <div class="mobile-bottom-bar-right">
      <a href="https://wa.me/5491123456789" target="_blank" rel="noopener" aria-label="WhatsApp">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
      </a>
    </div>
  </div>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" role="dialog" aria-label="Visor de imagen">
    <div class="lightbox-close" id="lightboxClose">&times;</div>
    <div class="lightbox-nav lightbox-prev" id="lightboxPrev">&#8249;</div>
    <img class="lightbox-img" id="lightboxImg" src="" alt="">
    <div class="lightbox-nav lightbox-next" id="lightboxNext">&#8250;</div>
  </div>

  <script src="../data/config.js"></script>
  <script src="../data/products.js"></script>
  <script src="../js/navigation.js"></script>
  <script src="../js/whatsapp.js"></script>
  <script src="../js/animations.js"></script>
  <script src="../js/gallery.js"></script>
  <script src="../js/viewer3d.js"></script>
  <script src="../js/arService.js"></script>
  <script>
    // Food page specific logic
    document.addEventListener('DOMContentLoaded', function() {
      const grid = document.getElementById('foodProducts');
      const filters = document.querySelectorAll('.food-filter-btn');
      let currentFilter = 'all';

      function renderProducts(filter) {
        const products = filter === 'all'
          ? PRODUCTS
          : PRODUCTS.filter(p => p.category === filter);

        grid.innerHTML = products.map(p => `
          <div class="product-card fade-in visible" data-category="${p.category}">
            <img class="product-card-image" src="../${p.image}" alt="${p.name}" loading="lazy">
            <div class="product-card-body">
              <h3 class="product-card-name">${p.name}</h3>
              <p class="product-card-desc">${p.short_description}</p>
              <div class="product-card-footer">
                <span class="product-card-price">$${p.price.toFixed(2)} USD</span>
                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                  ${p.model_glb ? `<button class="product-card-btn" onclick="window.location.href='producto.html?id=${p.id}'">Ver en 3D</button>` : ''}
                  <button class="product-card-btn" onclick="sendWhatsApp('${p.name}', ${p.price})">Pedir</button>
                </div>
              </div>
            </div>
          </div>
        `).join('');
      }

      filters.forEach(btn => {
        btn.addEventListener('click', function() {
          filters.forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          currentFilter = this.dataset.filter;
          renderProducts(currentFilter);
        });
      });

      renderProducts('all');
    });
  </script>
</body>
</html>
