<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products — La Tribu Admin</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍔</text></svg>">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* Edit modal overlay */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      z-index: 1000; justify-content: center; align-items: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--blanco); width: 95%; max-width: 580px; max-height: 90vh;
      overflow-y: auto; padding: 30px; position: relative;
    }
    .modal-close {
      position: absolute; top: 16px; right: 16px; background: none;
      border: none; font-size: 1.2rem; cursor: pointer; color: var(--texto-sec);
    }
    .modal-title { font-family: var(--font-serif); font-size: 1.2rem; font-weight: 600; margin-bottom: 24px; }
    .modal-field { margin-bottom: 18px; }
    .modal-label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; display: block; }
    .modal-input, .modal-select, .modal-textarea {
      width: 100%; padding: 10px 12px; border: 1px solid var(--borde); font-family: var(--font-sans);
      font-size: 0.85rem; outline: none; transition: border-color var(--transition-fast);
      box-sizing: border-box;
    }
    .modal-input:focus, .modal-select:focus, .modal-textarea:focus { border-color: var(--terracota); }
    .modal-textarea { resize: vertical; min-height: 80px; }
    .modal-row { display: flex; gap: 16px; }
    .modal-row .modal-field { flex: 1; }
    .modal-actions { display: flex; gap: 12px; margin-top: 24px; justify-content: flex-end; }
    .modal-btn {
      padding: 10px 20px; font-family: var(--font-sans); font-size: 0.75rem;
      font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em;
      border: none; cursor: pointer; transition: all var(--transition-fast);
    }
    .modal-btn-cancel { background: var(--crema); color: var(--texto-sec); }
    .modal-btn-cancel:hover { background: var(--borde); }
    .modal-btn-save { background: var(--terracota); color: var(--blanco); }
    .modal-btn-save:hover { background: var(--terracota-hover); }

    .model-status-dot {
      width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px;
    }
    .model-status-dot.completado { background: #2d6a4f; }
    .model-status-dot.procesando { background: var(--dorado); animation: pulse 1s ease infinite; }
    .model-status-dot.pendiente { background: var(--borde); }
    .model-status-dot.error { background: var(--terracota); }

    .btn-convert {
      padding: 4px 10px; font-size: 0.65rem; font-weight: 500; text-transform: uppercase;
      letter-spacing: 0.06em; border: 1px solid var(--dorado); background: var(--dorado);
      color: var(--blanco); cursor: pointer; transition: all var(--transition-fast);
    }
    .btn-convert:hover { background: var(--dorado-hover); }
    .btn-convert.processing {
      border-color: var(--borde); background: var(--crema-sec); color: var(--texto-sec);
      pointer-events: none;
    }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  </style>
</head>
<body style="background: var(--crema);">
  <button class="admin-mobile-toggle" id="adminToggle" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="admin-sidebar-title">Dashboard</div>
      <nav class="admin-nav">
        <a href="index.html" class="admin-nav-item"><i class="fa-solid fa-table-cells-large"></i> Overview</a>
        <a href="products.html" class="admin-nav-item active"><i class="fa-solid fa-utensils"></i> Products</a>
        <a href="categories.html" class="admin-nav-item"><i class="fa-solid fa-house"></i> Categories</a>
        <a href="conversions.html" class="admin-nav-item"><i class="fa-solid fa-circle"></i> 3D Conversions</a>
        <a href="settings.html" class="admin-nav-item"><i class="fa-solid fa-gear"></i> Settings</a>
      </nav>
    </aside>
    <main class="admin-main">
      <div class="admin-header">
        <h1 class="admin-header-title">Products</h1>
        <button class="admin-add-btn" onclick="openModal(null)">+ Add New Product</button>
      </div>
      <div class="admin-table-header">
        <h2 class="admin-table-title">All Products</h2>
        <input type="text" class="admin-search" id="productSearch" placeholder="Search products...">
      </div>
      <table class="admin-table" id="adminProductsTable">
        <thead>
          <tr>
            <th>Product Name</th>
            <th>Price</th>
            <th>Category</th>
            <th>3D Model</th>
            <th>Available</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="adminProductsBody"></tbody>
      </table>
    </main>
  </div>

  <!-- Edit / Add Modal -->
  <div class="modal-overlay" id="productModal">
    <div class="modal">
      <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
      <h2 class="modal-title" id="modalTitle">Edit Product</h2>
      <form id="productForm">
        <input type="hidden" id="modalProductId">
        <div class="modal-row">
          <div class="modal-field">
            <label class="modal-label" for="modalName">Product Name</label>
            <input class="modal-input" type="text" id="modalName" required>
          </div>
          <div class="modal-field">
            <label class="modal-label" for="modalPrice">Price (USD)</label>
            <input class="modal-input" type="number" step="0.01" id="modalPrice" required>
          </div>
        </div>
        <div class="modal-field">
          <label class="modal-label" for="modalShortDesc">Short Description</label>
          <input class="modal-input" type="text" id="modalShortDesc" maxlength="300">
        </div>
        <div class="modal-field">
          <label class="modal-label" for="modalDesc">Full Description</label>
          <textarea class="modal-textarea" id="modalDesc"></textarea>
        </div>
        <div class="modal-row">
          <div class="modal-field">
            <label class="modal-label" for="modalCategory">Category</label>
            <select class="modal-select" id="modalCategory">
              <option value="1">Comida</option>
              <option value="2">Snacks</option>
              <option value="3">Bebidas</option>
              <option value="4">Postres</option>
            </select>
          </div>
          <div class="modal-field">
            <label class="modal-label" for="modalImage">Image URL</label>
            <input class="modal-input" type="text" id="modalImage" placeholder="assets/images/example.webp">
          </div>
        </div>
        <div class="modal-row">
          <div class="modal-field">
            <label class="modal-label" for="modalGlb">GLB Model Path</label>
            <input class="modal-input" type="text" id="modalGlb" placeholder="assets/models/example.glb">
          </div>
          <div class="modal-field">
            <label class="modal-label" for="modalUsdz">USDZ Model Path</label>
            <input class="modal-input" type="text" id="modalUsdz" placeholder="assets/models/example.usdz">
          </div>
        </div>
        <div class="modal-field">
          <label class="modal-label" for="modalScale">Model Scale</label>
          <input class="modal-input" type="number" step="0.01" id="modalScale" value="1.0">
        </div>
        <div class="modal-actions">
          <button type="button" class="modal-btn modal-btn-cancel" onclick="closeModal()">Cancel</button>
          <button type="submit" class="modal-btn modal-btn-save">Save Product</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../data/products.js"></script>
  <script>
    var toggle = document.getElementById('adminToggle');
    var sidebar = document.getElementById('adminSidebar');
    if (toggle && sidebar) {
      toggle.addEventListener('click', function() { sidebar.classList.toggle('open'); });
      document.addEventListener('click', function(e) {
        if (!sidebar.contains(e.target) && e.target !== toggle) sidebar.classList.remove('open');
      });
    }

    function getStatusBadge(p) {
      var s = p.model_status || (p.model_glb ? 'completado' : null);
      var map = {
        completado: { cls: 'badge-complete', text: 'Complete' },
        procesando: { cls: 'badge-processing', text: 'Processing' },
        optimizando: { cls: 'badge-processing', text: 'Optimizing' },
        pendiente:  { cls: 'badge-pending',    text: 'Pending' },
        error:      { cls: 'badge-error',      text: 'Error' }
      };
      if (!s) return '<span class="badge badge-pending">No model</span>';
      var b = map[s] || map.pendiente;
      return '<span class="model-status-dot ' + s + '"></span><span class="badge ' + b.cls + '">' + b.text + '</span>';
    }

    function getConvertButton(p) {
      if (p.model_glb) return '';
      var onclick = 'window.location.href=\'conversions.html?product=' + p.id + '\'';
      return '<button class="btn-convert" onclick="' + onclick + '" title="Convert to 3D"><i class="fa-solid fa-cube"></i> Convert</button>';
    }

    function renderTable(filter) {
      var tbody = document.getElementById('adminProductsBody');
      if (!tbody || typeof PRODUCTS === 'undefined') return;
      var list = PRODUCTS.filter(function(p) { return !p.deleted_at; });
      if (filter) {
        var q = filter.toLowerCase();
        list = list.filter(function(p) {
          return p.name.toLowerCase().indexOf(q) !== -1 ||
                 p.category.toLowerCase().indexOf(q) !== -1;
        });
      }
      tbody.innerHTML = list.map(function(p) {
        return '<tr>' +
          '<td><div style="display:flex;align-items:center;gap:12px;">' +
            '<img class="admin-table-thumb" src="../' + p.image + '" alt="' + p.name + '" onerror="this.style.display=\'none\'">' +
            '<span class="admin-table-name">' + p.name + '</span>' +
          '</div></td>' +
          '<td class="admin-table-price">$' + p.price.toFixed(2) + '</td>' +
          '<td>' + p.category + '</td>' +
          '<td><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">' +
            getStatusBadge(p) +
            getConvertButton(p) +
          '</div></td>' +
          '<td>' + (p.available ? '<span style="color:#2d6a4f;">Yes</span>' : '<span style="color:#e63946;">No</span>') + '</td>' +
          '<td><div class="admin-actions">' +
            '<button class="admin-action-btn" title="Edit" onclick="openModal(' + p.id + ')"><i class="fa-solid fa-pen"></i></button>' +
            '<button class="admin-action-btn delete" title="Delete" onclick="deleteProduct(' + p.id + ')"><i class="fa-solid fa-trash"></i></button>' +
          '</div></td>' +
        '</tr>';
      }).join('');
    }

    document.getElementById('productSearch').addEventListener('input', function(e) {
      renderTable(e.target.value);
    });

    document.addEventListener('DOMContentLoaded', function() { renderTable(''); });

    // ---- Modal ----
    var modal = document.getElementById('productModal');

    function openModal(productId) {
      modal.classList.add('open');
      if (productId && typeof PRODUCTS !== 'undefined') {
        var p = PRODUCTS.find(function(x) { return x.id === productId; });
        if (!p) return;
        document.getElementById('modalTitle').textContent = 'Edit Product';
        document.getElementById('modalProductId').value = p.id;
        document.getElementById('modalName').value = p.name;
        document.getElementById('modalPrice').value = p.price;
        document.getElementById('modalShortDesc').value = p.short_description || '';
        document.getElementById('modalDesc').value = p.description || '';
        document.getElementById('modalImage').value = p.image || '';
        document.getElementById('modalGlb').value = p.model_glb || '';
        document.getElementById('modalUsdz').value = p.model_usdz || '';
        document.getElementById('modalScale').value = p.model_scale || 1;
      } else {
        document.getElementById('modalTitle').textContent = 'Add New Product';
        document.getElementById('productForm').reset();
        document.getElementById('modalProductId').value = '';
        document.getElementById('modalScale').value = '1';
      }
    }

    function closeModal() { modal.classList.remove('open'); }
    modal.addEventListener('click', function(e) { if (e.target === modal) closeModal(); });

    document.getElementById('productForm').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('Product saved. In production this sends PUT/POST to /api/products.');
      closeModal();
    });

    function deleteProduct(id) {
      if (confirm('Move this product to trash?')) {
        alert('Product moved to trash. In production this calls DELETE /api/products/' + id);
      }
    }
  </script>
</body>
</html>
