<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Conversions — La Tribu Admin</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍔</text></svg>">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body style="background: var(--crema);">
  <button class="admin-mobile-toggle" id="adminToggle" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="admin-sidebar-title">Dashboard</div>
      <nav class="admin-nav">
        <a href="index.html" class="admin-nav-item"><i class="fa-solid fa-table-cells-large"></i> Overview</a>
        <a href="products.html" class="admin-nav-item"><i class="fa-solid fa-utensils"></i> Products</a>
        <a href="categories.html" class="admin-nav-item"><i class="fa-solid fa-house"></i> Categories</a>
        <a href="conversions.html" class="admin-nav-item active"><i class="fa-solid fa-circle"></i> 3D Conversions</a>
        <a href="settings.html" class="admin-nav-item"><i class="fa-solid fa-gear"></i> Settings</a>
      </nav>
    </aside>
    <main class="admin-main">
      <div class="admin-header">
        <h1 class="admin-header-title">3D Conversions</h1>
      </div>
      <div class="admin-table-header">
        <h2 class="admin-table-title">Conversion History</h2>
      </div>
      <table class="admin-table">
        <thead>
          <tr><th>Product</th><th>Provider</th><th>Status</th><th>Date</th><th>Actions</th></tr>
        </thead>
        <tbody>
          <tr><td class="admin-table-name">Hamburguesa La Tribu</td><td>Meshy</td><td><span class="badge badge-complete">Complete</span></td><td>2024-01-15</td><td><div class="admin-actions"><button class="admin-action-btn" title="Download"><i class="fa-solid fa-download"></i></button></div></td></tr>
          <tr><td class="admin-table-name">Tacos Al Pastor</td><td>Meshy</td><td><span class="badge badge-processing">Processing</span></td><td>2024-01-16</td><td><div class="admin-actions"><button class="admin-action-btn" title="Refresh"><i class="fa-solid fa-rotate"></i></button></div></td></tr>
          <tr><td class="admin-table-name">Churros con Chocolate</td><td>—</td><td><span class="badge badge-pending">Pending</span></td><td>2024-01-16</td><td><div class="admin-actions"><button class="admin-action-btn" title="Start"><i class="fa-solid fa-play"></i></button></div></td></tr>
        </tbody>
      </table>
    </main>
  </div>
  <script>
    var toggle = document.getElementById('adminToggle');
    var sidebar = document.getElementById('adminSidebar');
    if (toggle && sidebar) {
      toggle.addEventListener('click', function() { sidebar.classList.toggle('open'); });
    }
  </script>
</body>
</html>
